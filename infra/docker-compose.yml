services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    platform: linux/amd64
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --block-time
      - "1"
    ports:
      - "8545:8545"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: overunder
      POSTGRES_PASSWORD: overunder
      POSTGRES_DB: overunder
    ports:
      - "5432:5432"
    volumes:
      - overunder_pg:/var/lib/postgresql/data

volumes:
  overunder_pg:
