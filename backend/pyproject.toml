[project]
name = "overunder-api"
version = "0.1.0"
description = "OverUnder FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "web3>=7.0.0",
  "eth-account>=0.13.0",
  "pyjwt>=2.9.0",
  "siwe>=4.0.0",
  "cdp-sdk>=1.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
