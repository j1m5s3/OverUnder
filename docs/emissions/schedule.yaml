# Remaining 45M OU stays in treasury for:
# - Future programs
# - Ecosystem development
# - Strategic partnerships
# - Emergency reserves

distribution_rules:
  - Treasury must approve EmissionsDistributor for sufficient allowance before each distribute call
  - Operator calls POST /emissions/distribute with program ID and recipient list
  - Contract enforces totalSupply unchanged (transfer-only, never mint)
  - NAV = USDC backing / totalSupply remains accurate since transfers don't affect either
  - FeeVault never receives minted OU; only fees from AMM/Exchange
  
notes:
  - Total allocation across all programs: 55M OU
  - Treasury reserve: 45M OU
  - Each program has independent schedule
  - Off-chain accounting tracks vested amounts per user
  - On-chain distribute calls transfer vested amounts in batches
