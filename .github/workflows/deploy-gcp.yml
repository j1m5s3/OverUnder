name: Deploy to GCP Cloud Run

# Manual dispatch only until stable
# To run: GitHub Actions tab → Deploy to GCP Cloud Run → Run workflow
on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: overunder-509107
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/overunder-509107/overunder
  API_SERVICE_NAME: overunder-api
  WEB_SERVICE_NAME: overunder-web
  ORACLE_JOB_NAME: overunder-oracle

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-deploy@overunder-509107.iam.gserviceaccount.com
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      
      - name: Preflight check required secrets
        run: |
          echo "Checking Secret Manager secrets..."
          
          # Check OU_JWT_SECRET has at least one version
          if ! gcloud secrets versions list OU_JWT_SECRET --project=${{ env.GCP_PROJECT_ID }} --limit=1 --format="value(name)" 2>/dev/null | grep -q .; then
            echo "ERROR: Secret OU_JWT_SECRET has no versions. Please add a version before deploying."
            exit 1
          fi
          
          # Check OU_ANVIL_RPC_URL has at least one version
          if ! gcloud secrets versions list OU_ANVIL_RPC_URL --project=${{ env.GCP_PROJECT_ID }} --limit=1 --format="value(name)" 2>/dev/null | grep -q .; then
            echo "ERROR: Secret OU_ANVIL_RPC_URL has no versions. Please add a version before deploying."
            exit 1
          fi
          
          # Check OU_DATABASE_URL has at least one version
          if ! gcloud secrets versions list OU_DATABASE_URL --project=${{ env.GCP_PROJECT_ID }} --limit=1 --format="value(name)" 2>/dev/null | grep -q .; then
            echo "ERROR: Secret OU_DATABASE_URL has no versions. Please add a version before deploying."
            exit 1
          fi
          
          # Check OU_DATABASE_URL is NOT sqlite/aiosqlite (Cloud Run needs persistent DB)
          # Never echo secret contents to avoid leaking credentials into logs
          DB_URL=$(gcloud secrets versions access latest --secret=OU_DATABASE_URL --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          if [ -z "$DB_URL" ]; then
            echo "ERROR: Secret OU_DATABASE_URL rejected: empty."
            echo "Cloud Run requires Cloud SQL or external PostgreSQL."
            echo "Expected format: postgresql://user:pass@host/dbname"
            exit 1
          fi
          if echo "$DB_URL" | grep -qiE "sqlite|aiosqlite"; then
            echo "ERROR: Secret OU_DATABASE_URL rejected: contains sqlite/aiosqlite."
            echo "Cloud Run requires persistent database (Cloud SQL or external PostgreSQL)."
            echo "Expected format: postgresql://user:pass@host/dbname"
            exit 1
          fi
          if ! echo "$DB_URL" | grep -qiE "^postgres"; then
            echo "WARNING: Secret OU_DATABASE_URL does not start with 'postgresql://' or 'postgres://'."
            echo "Proceeding anyway, but verify this is a valid database URL."
          fi
          
          echo "Preflight checks passed."
      
      - name: Preflight CDP secrets
        run: |
          echo "Checking CDP Secret Manager secrets..."
          for SECRET in OU_CDP_API_KEY_ID OU_CDP_API_KEY_SECRET; do
            if ! gcloud secrets versions list "$SECRET" --project=${{ env.GCP_PROJECT_ID }} --limit=1 --format="value(name)" 2>/dev/null | grep -q .; then
              echo "ERROR: Secret $SECRET has no versions. Create it before deploying."
              echo "gcloud secrets create $SECRET --project=${{ env.GCP_PROJECT_ID }}"
              echo "Then add a version. Deploy fails closed and does not invent keys."
              exit 1
            fi
          done
          echo "CDP preflight checks passed."
      
      - name: Preflight Cursor oracle secrets
        run: |
          echo "Checking Cursor oracle Secret Manager secrets..."
          for SECRET in OU_CURSOR_API_KEY OU_CURSOR_SEARCH_MCP_URL OU_AGENT_ALPHA_KEY OU_AGENT_BETA_KEY OU_AGENT_GAMMA_KEY; do
            if ! gcloud secrets versions list "$SECRET" --project=${{ env.GCP_PROJECT_ID }} --limit=1 --format="value(name)" 2>/dev/null | grep -q .; then
              echo "ERROR: Secret $SECRET has no versions. Create it before deploying the oracle job."
              echo "gcloud secrets create $SECRET --project=${{ env.GCP_PROJECT_ID }}"
              echo "Then add a version. Deploy fails closed and does not invent keys."
              exit 1
            fi
          done
          echo "Cursor oracle preflight checks passed."
      
      - name: Build and push API image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/api:latest ./backend
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest
      
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances=overunder-509107:us-central1:overunder-pg \
            --set-secrets=JWT_SECRET=OU_JWT_SECRET:latest,DATABASE_URL=OU_DATABASE_URL:latest,ANVIL_RPC_URL=OU_ANVIL_RPC_URL:latest,CDP_API_KEY_ID=OU_CDP_API_KEY_ID:latest,CDP_API_KEY_SECRET=OU_CDP_API_KEY_SECRET:latest,MOONPAY_SECRET=OU_MOONPAY_SECRET:latest,OPERATOR_PRIVATE_KEY=OU_OPERATOR_PRIVATE_KEY:latest,RELAYER_PRIVATE_KEY=OU_RELAYER_PRIVATE_KEY:latest \
            --set-env-vars="CHAIN_ID=84532,CDP_PROJECT_ID=${{ vars.CDP_PROJECT_ID || '' }},USDC_ADDRESS=${{ vars.USDC_ADDRESS || '' }},CTF_ADDRESS=${{ vars.CTF_ADDRESS || '' }},FACTORY_ADDRESS=${{ vars.FACTORY_ADDRESS || '' }},EXCHANGE_ADDRESS=${{ vars.EXCHANGE_ADDRESS || '' }},AMM_ADDRESS=${{ vars.AMM_ADDRESS || '' }},ORACLE_ADDRESS=${{ vars.ORACLE_ADDRESS || '' }},FEE_VAULT_ADDRESS=${{ vars.FEE_VAULT_ADDRESS || '' }},OU_TOKEN_ADDRESS=${{ vars.OU_TOKEN_ADDRESS || '' }},PAYMASTER_ADDRESS=${{ vars.PAYMASTER_ADDRESS || '' }},ENTRYPOINT_ADDRESS=${{ vars.ENTRYPOINT_ADDRESS || '' }},ACCOUNT_FACTORY_ADDRESS=${{ vars.ACCOUNT_FACTORY_ADDRESS || '' }},COINBASE_ONRAMP_APP_ID=${{ vars.COINBASE_ONRAMP_APP_ID || '' }}" \
            --project=${{ env.GCP_PROJECT_ID }}
      
      - name: Capture API URL
        id: api_url
        run: |
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE_NAME }} --platform=managed --region=${{ env.GCP_REGION }} --format='value(status.url)' --project=${{ env.GCP_PROJECT_ID }})
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "API deployed at: $API_URL"
      
      - name: Build and push Web image with real API URL
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_AMM_ADDRESS=${{ vars.AMM_ADDRESS }} \
            --build-arg NEXT_PUBLIC_USDC_ADDRESS=${{ vars.USDC_ADDRESS }} \
            --build-arg NEXT_PUBLIC_CTF_ADDRESS=${{ vars.CTF_ADDRESS }} \
            --build-arg NEXT_PUBLIC_RPC_URL=https://sepolia.base.org \
            --build-arg NEXT_PUBLIC_CDP_PROJECT_ID=${{ vars.CDP_PROJECT_ID }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/web:latest \
            ./web
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/web:latest
      
      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --project=${{ env.GCP_PROJECT_ID }}
      
      - name: Build and push oracle image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/oracle:${{ github.sha }} -t ${{ env.ARTIFACT_REGISTRY }}/oracle:latest ./oracles
          docker push ${{ env.ARTIFACT_REGISTRY }}/oracle:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/oracle:latest
      
      - name: Deploy oracle Cloud Run Job
        run: |
          API_URL=${{ steps.api_url.outputs.url }}
          gcloud run jobs deploy ${{ env.ORACLE_JOB_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/oracle:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --task-timeout=30m \
            --max-retries=0 \
            --set-env-vars="OU_API_URL=${API_URL},OU_CURSOR_RUNTIME=cloud,OU_SCOUT_MAX_MARKETS=5,CHAIN_ID=84532,ORACLE_ADDRESS=${{ vars.ORACLE_ADDRESS || '' }},OU_SEED_USDC=${{ vars.OU_SEED_USDC || '200000000' }},OU_RESOLVE_MAX_MARKETS=3" \
            --set-secrets="CURSOR_API_KEY=OU_CURSOR_API_KEY:latest,CURSOR_SEARCH_MCP_URL=OU_CURSOR_SEARCH_MCP_URL:latest,JWT_SECRET=OU_JWT_SECRET:latest,OPERATOR_PRIVATE_KEY=OU_OPERATOR_PRIVATE_KEY:latest,AGENT_ALPHA_KEY=OU_AGENT_ALPHA_KEY:latest,AGENT_BETA_KEY=OU_AGENT_BETA_KEY:latest,AGENT_GAMMA_KEY=OU_AGENT_GAMMA_KEY:latest,ANVIL_RPC_URL=OU_ANVIL_RPC_URL:latest" \
            --project=${{ env.GCP_PROJECT_ID }}
      
      - name: Schedule oracle job every 15 minutes
        run: |
          SCHEDULER_NAME=overunder-oracle-tick
          URI="https://${{ env.GCP_REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.GCP_PROJECT_ID }}/jobs/${{ env.ORACLE_JOB_NAME }}:run"
          SA=github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          gcloud services enable cloudscheduler.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet || true
          if gcloud scheduler jobs describe "$SCHEDULER_NAME" --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_NAME" \
              --location=${{ env.GCP_REGION }} \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --oauth-service-account-email="$SA" \
              --attempt-deadline=180s \
              --project=${{ env.GCP_PROJECT_ID }} \
              --quiet
          else
            gcloud scheduler jobs create http "$SCHEDULER_NAME" \
              --location=${{ env.GCP_REGION }} \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --oauth-service-account-email="$SA" \
              --attempt-deadline=180s \
              --project=${{ env.GCP_PROJECT_ID }} \
              --quiet
          fi
      
      - name: Output Service URLs
        run: |
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE_NAME }} --platform=managed --region=${{ env.GCP_REGION }} --format='value(status.url)' --project=${{ env.GCP_PROJECT_ID }})
          WEB_URL=$(gcloud run services describe ${{ env.WEB_SERVICE_NAME }} --platform=managed --region=${{ env.GCP_REGION }} --format='value(status.url)' --project=${{ env.GCP_PROJECT_ID }})
          echo "API Service: $API_URL"
          echo "Web Service: $WEB_URL"
          echo "Oracle Job: ${{ env.ORACLE_JOB_NAME }}"
          echo "Oracle Scheduler: overunder-oracle-tick (*/15 * * * *)"
