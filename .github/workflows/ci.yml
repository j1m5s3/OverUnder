name: CI

# Tests only: no secrets, no cloud access.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - name: Install
        run: python -m pip install -r contracts/requirements.txt
      - name: pytest
        working-directory: contracts
        run: python -m pytest -q

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contracts/requirements.txt
      # contracts/requirements.txt brings titanoboa + vyper: test_order_eip712.py checks the backend's
      # EIP-712 order digest against Exchange.vy hashOrder (the OU-T003 relayer depends on it).
      - name: Install
        run: python -m pip install -r backend/requirements.txt -r contracts/requirements.txt
      - name: pytest
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/backend-pytest.txt"
          # A missing dependency must fail CI, not skip the cross-package parity checks silently.
          if grep -E '^SKIPPED' "$RUNNER_TEMP/backend-pytest.txt" | grep -Ei 'could not import|not importable|No module named|not installed'; then
            echo "::error::backend tests were skipped for a missing dependency (see the SKIPPED lines above)"
            exit 1
          fi

  oracles:
    name: oracles (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oracles/requirements.txt
      - name: Install
        run: python -m pip install -r oracles/requirements.txt
      - name: pytest
        working-directory: oracles
        run: python -m pytest -q

  scripts:
    name: scripts (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oracles/requirements.txt
      # scripts/audit_markets.py itself is stdlib-only; its parity tests import oracles/ (eth-account, httpx)
      # and eth_utils (via web3) to check selectors and candidate rules against the oracle job.
      - name: Install
        run: python -m pip install -r oracles/requirements.txt
      - name: unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s scripts/tests -v 2>&1 | tee "$RUNNER_TEMP/scripts-unittest.txt"
          # A missing dependency must fail CI, not skip the parity checks silently.
          if grep -Ei "skipped .*(not installed|not importable|No module named|could not import)" "$RUNNER_TEMP/scripts-unittest.txt"; then
            echo "::error::scripts parity tests were skipped for a missing dependency (see above)"
            exit 1
          fi

  web:
    name: web (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --if-present
